name: MqvpnPoC
options:
  deploymentTarget:
    iOS: "15.0"
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
    LIBRARY_SEARCH_PATHS: "$(SRCROOT)/../build"
    HEADER_SEARCH_PATHS: "$(SRCROOT)/../../include $(SRCROOT)/../../src $(SRCROOT)/Shared"
schemes:
  MqvpnPoC:
    build:
      targets:
        MqvpnPoC: all
targets:
  MqvpnPoC:
    type: application
    platform: iOS
    sources:
      - App
      # PoCConfig.swift is shared with the extension; the C files are not
      # needed by the app (and the host test defines main()) — exclude them.
      - path: Shared
        excludes: ["*.c"]
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        PRODUCT_BUNDLE_IDENTIFIER: com.zackjackson.mqvpn
        PROVISIONING_PROFILE_SPECIFIER: mqvpn iPhone Development
    entitlements:
      path: App.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    dependencies:
      - target: PacketTunnel
        embed: true
      - target: MqvpnLiveActivity
        embed: true
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        # Declared so the opt-in Live Activity keepalive (TunnelKeepAlive) may
        # hold the app runnable while the tunnel is up; inert unless enabled.
        UIBackgroundModes: [audio]
        NSLocalNetworkUsageDescription: Allow your Mac to send authenticated mqvpn relay datagrams to this iPhone.
        NSBonjourServices:
          - _mqvpn-relay._udp
        MqvpnServerHost: $(MQVPN_POC_SERVER_HOST)
        MqvpnServerPort: $(MQVPN_POC_SERVER_PORT)
        MqvpnServerName: $(MQVPN_POC_SERVER_NAME)
        MqvpnBulkURL: $(MQVPN_POC_BULK_URL)
        MqvpnAuthKey: $(MQVPN_POC_AUTH_KEY)
        MqvpnTLSInsecure: $(MQVPN_POC_TLS_INSECURE)
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - PacketTunnel
      # host test defines main() — never compile it into a target
      - path: Shared
        excludes: ["clock_shim_host_test.c"]
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        PRODUCT_BUNDLE_IDENTIFIER: com.zackjackson.mqvpn.PacketTunnel
        PROVISIONING_PROFILE_SPECIFIER: mqvpn PacketTunnel Development
        SWIFT_OBJC_BRIDGING_HEADER: PacketTunnel/BridgingHeader.h
        # libmqvpn contains the shared relay codec and Apple's system-trust
        # verifier; crypto supplies HMAC, while Security/CoreFoundation back
        # SecTrust on physical iOS.
        OTHER_LDFLAGS: "-lmqvpn -llwip_core -lxquic-static -lssl -lcrypto -framework Security -framework CoreFoundation -lc++"
    entitlements:
      path: PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    info:
      path: PacketTunnel/Info.plist
      properties:
        MqvpnServerHost: $(MQVPN_POC_SERVER_HOST)
        MqvpnServerPort: $(MQVPN_POC_SERVER_PORT)
        MqvpnServerName: $(MQVPN_POC_SERVER_NAME)
        MqvpnAuthKey: $(MQVPN_POC_AUTH_KEY)
        MqvpnTLSInsecure: $(MQVPN_POC_TLS_INSECURE)
        NSLocalNetworkUsageDescription: Allow your Mac to send authenticated mqvpn relay datagrams to this iPhone.
        NSBonjourServices:
          - _mqvpn-relay._udp
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
  MqvpnLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - LiveActivity
      - path: Shared
        includes:
          - LiveActivityContent.swift
          - MqvpnNetworkActivityAttributes.swift
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.zackjackson.mqvpn.LiveActivity
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: LiveActivity/Info.plist
      properties:
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

[Service]
# The upstream hardening directives below require a private mount namespace.
# An unprivileged, non-nesting Proxmox LXC cannot create that namespace.
# Keep the container/AppArmor boundary and non-filesystem service restrictions,
# while disabling only the mount-namespace-dependent unit settings.
ProtectHome=false
ProtectSystem=false
PrivateTmp=false
ProtectKernelModules=false
ProtectControlGroups=false
ReadOnlyPaths=
ReadWritePaths=
